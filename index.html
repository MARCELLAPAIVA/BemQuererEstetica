function rowToAppt(r){
  return { id:r.id, serviceId:r.service_id, serviceName:r.service_name, duration:r.duration, price:Number(r.price),
    date:r.date, time:r.time, clientName:r.client_name, clientPhone:r.client_phone, status:r.status,
    createdAt:r.created_at, note:r.note||'' };
}

const DOW_NAMES = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DOW_SHORT = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];

let DATA = { services: null, settings: null, appointments: null };
let loaded = false;

let view = 'agendar'; // agendar | meupedido | adminlogin | admin
let adminTab = 'pedidos'; // pedidos | agenda | horarios | servicos
let booking = { serviceId:null, date:null, time:null, name:'', phone:'' };
let openCategory = null;
let lastRequestId = null;
let meuPedidoPhone = '';
let adminPinInput = '';
let adminAuthed = false;
let pedidosFilter = 'pendente'; // pendente | confirmado | realizado | cancelado | todas

function petalSVG(state, size=18){
  const filled = state==='confirmado' || state==='realizado';
  const muted = state==='recusado' || state==='cancelado';
  const color = filled ? 'var(--sage-dark)' : muted ? '#C9BDB8' : 'var(--gold)';
  const fill = filled ? color : 'none';
  let petals='';
  for(let i=0;i<5;i++){
    petals += `<ellipse cx="12" cy="5" rx="3" ry="4.8" fill="${fill}" stroke="${color}" stroke-width="1.3" transform="rotate(${i*72} 12 12)"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none">${petals}<circle cx="12" cy="12" r="2" fill="${muted?'#C9BDB8':'var(--gold)'}"/></svg>`;
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return n.toString().padStart(2,'0'); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function tomorrowStr(){ const d=new Date(); d.setDate(d.getDate()+1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function toMin(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function toHHMM(min){ return `${pad(Math.floor(min/60))}:${pad(min%60)}`; }
function fmtDate(dstr){ const d = new Date(dstr+'T00:00:00'); return `${DOW_NAMES[d.getDay()]}, ${d.getDate()} de ${['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][d.getMonth()]}`; }
function onlyDigits(s){ return (s||'').replace(/\D/g,''); }

function toast(msg){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  host.innerHTML=''; host.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3200);
}

const DEFAULT_CATEGORIES = ['Pele','Cabelo','Corpo','Outros'];
function defaultServices(){
  return [
    {id:uid(),name:'Limpeza de Pele Profunda',duration:60,price:120,category:'Pele'},
    {id:uid(),name:'Design de Sobrancelhas',duration:30,price:40,category:'Pele'},
    {id:uid(),name:'Massagem Modeladora',duration:50,price:100,category:'Corpo'},
    {id:uid(),name:'Drenagem Linfática',duration:60,price:110,category:'Corpo'},
    {id:uid(),name:'Peeling Facial',duration:45,price:150,category:'Pele'},
  ];
}
function defaultSettings(){
  const wh = {};
  for(let i=0;i<7;i++){ wh[i] = (i>=1 && i<=5) ? {active:true,start:'09:00',end:'18:00'} : (i===6 ? {active:true,start:'09:00',end:'13:00'} : {active:false,start:'09:00',end:'18:00'}); }
  return { workingHours:wh, slotInterval:30, blockedDates:[], whatsappNumber:'5521987721345', pin:'1234', serviceCategories: DEFAULT_CATEGORIES.slice() };
}
function getAllCategories(){
  const base = (DATA.settings.serviceCategories && DATA.settings.serviceCategories.length) ? DATA.settings.serviceCategories.slice() : DEFAULT_CATEGORIES.slice();
  DATA.services.forEach(s=>{ if(s.category && !base.includes(s.category)) base.push(s.category); });
  if(!base.includes('Outros')) base.push('Outros');
  return base;
}

async function loadAll(){
  if(sb){
    try{
      const [svc, st, ap, sess] = await Promise.all([
        sb.from('services').select('*').order('name'),
        sb.from('settings').select('*').eq('id',1).single(),
        sb.from('appointments').select('*').order('date').order('time'),
        sb.auth.getSession()
      ]);
      DATA.services = (svc.data||[]).map(r=>({id:r.id,name:r.name,duration:r.duration,price:Number(r.price),category:r.category||'Outros'}));
      DATA.settings = st.data ? {
        workingHours: st.data.working_hours, slotInterval: st.data.slot_interval,
        blockedDates: st.data.blocked_dates||[], whatsappNumber: st.data.whatsapp_number||'', pin:'1234',
        serviceCategories: (st.data.service_categories && st.data.service_categories.length) ? st.data.service_categories : DEFAULT_CATEGORIES.slice()
      } : defaultSettings();
      DATA.appointments = (ap.data||[]).map(rowToAppt);
      adminAuthed = !!(sess.data && sess.data.session);
    }catch(e){
      toast('Não deu para conectar ao Supabase. Confira a URL e a chave.');
      DATA.services = defaultServices(); DATA.settings = defaultSettings(); DATA.appointments = [];
    }
    loaded = true;
    return;
  }
  try{
    const s = await window.storage.get('services', STORAGE_SHARED);
    DATA.services = s ? JSON.parse(s.value) : defaultServices();
    DATA.services.forEach(sv=>{ if(!sv.category) sv.category='Outros'; });
  }catch(e){ DATA.services = defaultServices(); }
  try{
    const st = await window.storage.get('settings', STORAGE_SHARED);
    DATA.settings = st ? JSON.parse(st.value) : defaultSettings();
    if(!DATA.settings.serviceCategories || !DATA.settings.serviceCategories.length) DATA.settings.serviceCategories = DEFAULT_CATEGORIES.slice();
  }catch(e){ DATA.settings = defaultSettings(); }
  try{
    const ap = await window.storage.get('appointments', STORAGE_SHARED);
    DATA.appointments = ap ? JSON.parse(ap.value) : [];
  }catch(e){ DATA.appointments = []; }
  loaded = true;
}

async function saveSettings(){
  if(sb){
    try{
      await sb.from('settings').update({
        working_hours: DATA.settings.workingHours,
        slot_interval: DATA.settings.slotInterval,
        blocked_dates: DATA.settings.blockedDates,
        whatsapp_number: DATA.settings.whatsappNumber,
        service_categories: DATA.settings.serviceCategories
      }).eq('id',1);
    }catch(e){ toast('Não deu para salvar no Supabase.'); }
    return;
  }
  try{ await window.storage.set('settings', JSON.stringify(DATA.settings), STORAGE_SHARED); }catch(e){ toast('Não deu para salvar. Tenta de novo.'); }
}

async function insertAppointment(appt){
  if(sb){
    try{
      const { data, error } = await sb.from('appointments').insert({
        service_id: appt.serviceId, service_name: appt.serviceName, duration: appt.duration, price: appt.price,
        date: appt.date, time: appt.time, client_name: appt.clientName, client_phone: appt.clientPhone,
        status: 'pendente', note: ''
      }).select().single();
      if(error) throw error;
      const saved = rowToAppt(data);
      DATA.appointments.push(saved);
      return saved;
    }catch(e){ toast('Não deu para enviar sua marcação. Tenta de novo.'); return null; }
  }
  DATA.appointments.push(appt);
  try{ await window.storage.set('appointments', JSON.stringify(DATA.appointments), STORAGE_SHARED); }catch(e){ toast('Não deu para salvar. Tenta de novo.'); }
  return appt;
}

async function updateAppointmentStatus(id, status){
  const a = DATA.appointments.find(x=>x.id===id);
  a.status = status;
  if(sb){
    try{ await sb.from('appointments').update({status}).eq('id',id); }
    catch(e){ toast('Não deu para salvar no Supabase.'); }
    return;
  }
  try{ await window.storage.set('appointments', JSON.stringify(DATA.appointments), STORAGE_SHARED); }catch(e){ toast('Não deu para salvar. Tenta de novo.'); }
}

function next14Days(){
  const arr=[]; const d=new Date();
  for(let i=0;i<14;i++){
    const dd=new Date(d); dd.setDate(d.getDate()+i);
    arr.push(`${dd.getFullYear()}-${pad(dd.getMonth()+1)}-${pad(dd.getDate())}`);
  }
  return arr;
}

function isDateBlocked(dateStr){ return DATA.settings.blockedDates.some(b=>b.date===dateStr); }

function availableSlots(dateStr, duration){
  const dow = new Date(dateStr+'T00:00:00').getDay();
  const wh = DATA.settings.workingHours[dow];
  if(!wh || !wh.active) return [];
  if(isDateBlocked(dateStr)) return [];
  const start = toMin(wh.start), end = toMin(wh.end);
  const interval = DATA.settings.slotInterval || 30;
  const existing = DATA.appointments.filter(a=>a.date===dateStr && (a.status==='pendente'||a.status==='confirmado'));
  const slots=[];
  const isToday = dateStr===todayStr();
  const nowMin = new Date().getHours()*60+new Date().getMinutes();
  for(let t=start;t+duration<=end;t+=interval){
    if(isToday && t<=nowMin+15) continue;
    const overlaps = existing.some(a=>{
      const aStart=toMin(a.time), aEnd=aStart+a.duration;
      return t < aEnd && aStart < t+duration;
    });
    if(!overlaps) slots.push(toHHMM(t));
  }
  return slots;
}

function waLink(phone, text){
  const digits = onlyDigits(phone);
  return `https://wa.me/${digits}?text=${encodeURIComponent(text)}`;
}

// ---------- CALENDÁRIO (Google Calendar / Apple / Outlook via .ics) ----------
function apptDateRange(a){
  const [y,mo,d] = a.date.split('-').map(Number);
  const [h,mi] = a.time.split(':').map(Number);
  const start = new Date(y, mo-1, d, h, mi);
  const end = new Date(start.getTime() + a.duration*60000);
  const fmt = dt => `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;
  return { startStr: fmt(start), endStr: fmt(end) };
}
function googleCalLink(a){
  const { startStr, endStr } = apptDateRange(a);
  const text = encodeURIComponent(`${a.serviceName} — Bem Querer Estética`);
  const details = encodeURIComponent(`Atendimento: ${a.serviceName}\nCliente: ${a.clientName}\nBem Querer Estética — Shirlei Andrade`);
  const location = encodeURIComponent('Bem Querer Estética');
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${startStr}/${endStr}&details=${details}&location=${location}`;
}
function icsEscape(s){ return String(s).replace(/([,;])/g,'\\$1'); }
function icsContent(a){
  const { startStr, endStr } = apptDateRange(a);
  const now = new Date();
  const dtstamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
  return [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Bem Querer Estetica//Agendamento//PT','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${a.id}@bemquererestetica`,
    `DTSTAMP:${dtstamp}`,
    `DTSTART:${startStr}`,
    `DTEND:${endStr}`,
    `SUMMARY:${icsEscape(a.serviceName)} — Bem Querer Estética`,
    `DESCRIPTION:${icsEscape('Atendimento de '+a.clientName+' — '+a.serviceName)}`,
    'LOCATION:Bem Querer Estética',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
}
function downloadICS(id){
  const a = DATA.appointments.find(x=>x.id===id);
  if(!a) return;
  const blob = new Blob([icsContent(a)], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `atendimento-${a.date}-${a.time.replace(':','')}.ics`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function calActionsHTML(a){
  return `
    <div class="cal-actions">
      <a class="btn btn-cal" href="${googleCalLink(a)}" target="_blank">📅 Google Calendar</a>
      <button class="btn btn-cal" onclick="downloadICS('${a.id}')">📅 Apple / Outlook (.ics)</button>
    </div>
  `;
}

              <div class="req-name">${a.time} — ${a.clientName}</div>
              <div class="req-meta">${a.serviceName} · ${a.duration}min</div>
              <div class="req-meta">WhatsApp: ${a.clientPhone}</div>
            </div>
            <span class="status-badge status-confirmado">${petalSVG('confirmado',14)} Confirmado</span>
          </div>
          <div class="req-actions">
            ${a.clientPhone ? `<a class="btn btn-sage" style="text-decoration:none;" href="${waLink(a.clientPhone, msg)}" target="_blank">Enviar lembrete no WhatsApp</a>` : `<span class="empty" style="padding:0;">Sem WhatsApp cadastrado</span>`}
          </div>
        </div>
      `;
    });
  }
  html += `</div>`;
  return html;
}

function renderAdminAgenda(){
  const upcoming = DATA.appointments.filter(a=>a.status==='confirmado' && a.date>=todayStr()).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
  const byDate = {};
  upcoming.forEach(a=>{ (byDate[a.date] = byDate[a.date]||[]).push(a); });
  let html = `<div class="card"><div class="section-title">Próximos atendimentos confirmados</div>`;
  const dates = Object.keys(byDate);
  if(dates.length===0){
    html += `<div class="empty">Ainda não há atendimentos confirmados nos próximos dias.</div>`;
  } else {
    dates.forEach(d=>{
      html += `<div style="margin-top:14px;font-weight:800;color:var(--wine-dark);font-size:13px;text-transform:uppercase;letter-spacing:.05em;">${fmtDate(d)}</div>`;
      byDate[d].forEach(a=>{
        html += `
          <div class="req-item">
            <div class="req-top">
              <div>
                <div class="req-name">${a.time} — ${a.clientName}</div>
                <div class="req-meta">${a.serviceName} · ${a.duration}min</div>
                <div class="req-meta">WhatsApp: ${a.clientPhone}</div>
              </div>
              <span class="status-badge status-confirmado">${petalSVG('confirmado',14)} Confirmado</span>
            </div>
            ${apptActionsHTML(a)}
          </div>
        `;
      });
    });
  }
  html += `</div>`;
  return html;
}

function renderAdminHorarios(){
  let html = `<div class="card"><div class="section-title">Dias e horários de atendimento</div>`;
  for(let i=0;i<7;i++){
    const wh = DATA.settings.workingHours[i];
    html += `
      <div class="day-row">
        <div class="dname">${DOW_NAMES[i]}</div>
        <button class="toggle ${wh.active?'on':''}" onclick="toggleDay(${i})"><span></span></button>
        ${wh.active ? `
          <input type="time" value="${wh.start}" onchange="setDayTime(${i},'start',this.value)">
          <span style="color:var(--ink-soft);">às</span>
          <input type="time" value="${wh.end}" onchange="setDayTime(${i},'end',this.value)">
        ` : `<span class="empty" style="padding:0;">Fechado</span>`}
      </div>
    `;
  }
  html += `
    <label>Intervalo entre horários disponíveis (minutos)</label>
    <select onchange="setInterval(this.value)">
      ${[15,20,30,45,60].map(v=>`<option value="${v}" ${DATA.settings.slotInterval==v?'selected':''}>${v} min</option>`).join('')}
    </select>
  </div>`;

  html += `<div class="card"><div class="section-title">Bloquear datas (folgas, feriados)</div>`;
  html += `<div style="display:flex;gap:8px;">
      <input type="date" id="blockDateInput" style="flex:1;">
      <input type="text" id="blockNoteInput" placeholder="Motivo (opcional)" style="flex:1;">
      <button class="btn btn-ghost" onclick="addBlockedDate()">Bloquear</button>
    </div>`;
  html += `<div style="margin-top:10px;">`;
  if(DATA.settings.blockedDates.length===0){
    html += `<div class="empty">Nenhuma data bloqueada.</div>`;
  } else {
    DATA.settings.blockedDates.sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{
      html += `<span class="chip">${fmtDate(b.date)}${b.note?` — ${b.note}`:''} <button onclick="removeBlockedDate('${b.date}')">✕</button></span>`;
    });
  }
  html += `</div></div>`;
  return html;
}
function toggleDay(i){ DATA.settings.workingHours[i].active = !DATA.settings.workingHours[i].active; saveSettings(); render(); }
function setDayTime(i,field,val){ DATA.settings.workingHours[i][field]=val; saveSettings(); }
function setInterval(v){ DATA.settings.slotInterval = Number(v); saveSettings(); }
function addBlockedDate(){
  const dateEl = document.getElementById('blockDateInput');
  const noteEl = document.getElementById('blockNoteInput');
  if(!dateEl.value){ toast('Escolha uma data para bloquear.'); return; }
  if(DATA.settings.blockedDates.some(b=>b.date===dateEl.value)){ toast('Essa data já está bloqueada.'); return; }
  DATA.settings.blockedDates.push({date:dateEl.value, note:noteEl.value.trim()});
  saveSettings(); render();
}
function removeBlockedDate(d){ DATA.settings.blockedDates = DATA.settings.blockedDates.filter(b=>b.date!==d); saveSettings(); render(); }

function renderAdminServicos(){
  const categories = getAllCategories();
  let html = `
    <div class="card">
      <div class="section-title">Categorias de serviços</div>
      <p style="color:var(--ink-soft);font-size:13px;margin-top:-6px;">Organize os serviços em grupos (ex: Pele, Cabelo, Corpo) para ficar mais fácil de escolher na hora de agendar.</p>
      <div>`;
  categories.forEach(c=>{
    html += `<span class="chip">${c}${c!=='Outros' ? ` <button onclick="removeCategory('${c.replace(/'/g,"\\'")}')" title="Remover categoria">✕</button>` : ''}</span>`;
  });
  html += `</div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <input type="text" id="newCategoryInput" placeholder="Nova categoria (ex: Cabelo)" style="flex:1;">
        <button class="btn btn-ghost" onclick="addCategory()">Adicionar</button>
      </div>
    </div>
  `;

  categories.forEach(cat=>{
    const svcs = DATA.services.filter(s=>s.category===cat);
    if(svcs.length===0) return;
    html += `<div class="card"><div class="section-title">${cat}</div>`;
    svcs.forEach(s=>{
      html += `
        <div class="svc-admin-row">
          <input type="text" value="${s.name}" style="flex:2;min-width:140px;" onchange="updateService('${s.id}','name',this.value)">
          <input type="number" value="${s.duration}" style="flex:1;min-width:70px;" onchange="updateService('${s.id}','duration',Number(this.value))">
          <span style="font-size:12px;color:var(--ink-soft);">min</span>
          <input type="number" value="${s.price}" style="flex:1;min-width:80px;" onchange="updateService('${s.id}','price',Number(this.value))">
          <select style="flex:1;min-width:120px;" onchange="updateService('${s.id}','category',this.value)">
            ${categories.map(c=>`<option value="${c}" ${s.category===c?'selected':''}>${c}</option>`).join('')}
          </select>
          <button class="btn btn-danger" style="padding:8px 12px;" onclick="removeService('${s.id}')">Remover</button>
        </div>
      `;
    });
    html += `</div>`;
  });

  html += `
    <div class="card">
      <div class="section-title">Adicionar novo serviço</div>
      <label>Nome</label><input type="text" id="newSvcName" placeholder="Ex: Massagem Relaxante">
      <div style="display:flex;gap:10px;">
        <div style="flex:1;"><label>Duração (min)</label><input type="number" id="newSvcDuration" value="60"></div>
        <div style="flex:1;"><label>Preço (R$)</label><input type="number" id="newSvcPrice" value="100"></div>
      </div>
      <label>Categoria</label>
      <select id="newSvcCategory">${categories.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      <button class="btn btn-primary" style="margin-top:14px;" onclick="addService()">Adicionar serviço</button>
    </div>
  `;
  return html;
}
function addCategory(){
  const el = document.getElementById('newCategoryInput');
  const name = el.value.trim();
  if(!name){ toast('Digite um nome para a categoria.'); return; }
  if(!DATA.settings.serviceCategories) DATA.settings.serviceCategories = DEFAULT_CATEGORIES.slice();
  if(DATA.settings.serviceCategories.includes(name)){ toast('Essa categoria já existe.'); return; }
  DATA.settings.serviceCategories.push(name);
  saveSettings();
  render();
}
async function removeCategory(name){
  if(name==='Outros') return;
  if(!confirm(`Remover a categoria "${name}"? Os serviços dela passam para "Outros".`)) return;
  DATA.settings.serviceCategories = (DATA.settings.serviceCategories||DEFAULT_CATEGORIES.slice()).filter(c=>c!==name);
  const affected = DATA.services.filter(s=>s.category===name);
  affected.forEach(s=>{ s.category='Outros'; });
  saveSettings();
  if(sb){
    try{ await Promise.all(affected.map(s=> sb.from('services').update({category:'Outros'}).eq('id',s.id))); }
    catch(e){ toast('Não deu para atualizar todos os serviços no Supabase.'); }
  } else if(affected.length){
    try{ await window.storage.set('services', JSON.stringify(DATA.services), STORAGE_SHARED); }catch(e){}
  }
  render();
}
async function updateService(id,field,val){
  const s=DATA.services.find(x=>x.id===id); s[field]=val;
  if(sb){
    try{ await sb.from('services').update({[field]:val}).eq('id',id); }catch(e){ toast('Não deu para salvar no Supabase.'); }
    return;
  }
  try{ await window.storage.set('services', JSON.stringify(DATA.services), STORAGE_SHARED); }catch(e){ toast('Não deu para salvar. Tenta de novo.'); }
}
async function removeService(id){
  DATA.services = DATA.services.filter(s=>s.id!==id);
  if(sb){
    try{ await sb.from('services').delete().eq('id',id); }catch(e){ toast('Não deu para remover no Supabase.'); }
    render(); return;
  }
  try{ await window.storage.set('services', JSON.stringify(DATA.services), STORAGE_SHARED); }catch(e){ toast('Não deu para salvar. Tenta de novo.'); }
  render();
}
async function addService(){
  const name = document.getElementById('newSvcName').value.trim();
  const duration = Number(document.getElementById('newSvcDuration').value);
  const price = Number(document.getElementById('newSvcPrice').value);
  const category = document.getElementById('newSvcCategory').value || 'Outros';
  if(!name){ toast('Dê um nome para o serviço.'); return; }
  if(sb){
    try{
      const { data, error } = await sb.from('services').insert({name,duration,price,category}).select().single();
      if(error) throw error;
      DATA.services.push({id:data.id,name:data.name,duration:data.duration,price:Number(data.price),category:data.category||category});
    }catch(e){ toast('Não deu para salvar no Supabase.'); return; }
    render(); return;
  }
  DATA.services.push({id:uid(),name,duration,price,category});
  try{ await window.storage.set('services', JSON.stringify(DATA.services), STORAGE_SHARED); }catch(e){ toast('Não deu para salvar. Tenta de novo.'); }
  render();
}

function renderAdminConfig(){
  let html = `
    <div class="card">
      <div class="section-title">WhatsApp da profissional</div>
      <p style="color:var(--ink-soft);font-size:13px;margin-top:-6px;">Número que recebe os avisos das clientes e para onde as confirmações são enviadas. Formato: DDI+DDD+número, só números (ex: 5521900000000).</p>
      <input type="text" value="${DATA.settings.whatsappNumber}" placeholder="5521900000000" onchange="updateWhats(this.value)">
    </div>
  `;
  if(sb){
    html += `
    <div class="card">
      <div class="section-title">Acesso ao painel</div>
      <p style="color:var(--ink-soft);font-size:13px;margin-top:-6px;">O login agora é por e-mail e senha. Para trocar a senha ou dar acesso a outra pessoa, contate o administrador.</p>
    </div>`;
  } else {
    html += `
    <div class="card">
      <div class="section-title">Código de acesso do painel</div>
      <p style="color:var(--ink-soft);font-size:13px;margin-top:-6px;">Use para entrar na área da profissional.</p>
      <input type="text" value="${DATA.settings.pin}" onchange="updatePin(this.value)">
    </div>`;
  }
  html += `
    <div class="warn-box">
      ${sb ? 'Este site está conectado ao Supabase: as marcações, a agenda, os serviços e o login ficam salvos de verdade no seu banco de dados.' : 'Este é um protótipo funcional: as marcações e a agenda ficam salvas aqui na prévia do Claude — para dados de verdade, conecte o Supabase.'} O envio das mensagens de WhatsApp é feito com um toque (abre o WhatsApp já com o texto pronto) — não existe envio 100% automático sem conectar a uma API oficial do WhatsApp Business.
    </div>
  `;
  return html;
}
function updateWhats(v){ DATA.settings.whatsappNumber = onlyDigits(v); saveSettings(); toast('Número salvo.'); }
function updatePin(v){ DATA.settings.pin = v.trim() || '1234'; saveSettings(); toast('Código atualizado.'); }

// ---------- INIT ----------
(async function init(){
  render();
  await loadAll();
  render();
})();
</script>
